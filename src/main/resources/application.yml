spring:
  application:
    name: fiscal-document-adapter
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:fiscaladapter
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

fiscaladapter:
  ambiente: dev
  seguranca:
    # Chave AES-256 (base64, 32 bytes) usada para criptografar dados sensiveis em
    # repouso (ex.: resposta de idempotencia com XML assinado da NFe - ver
    # CriptografiaEmRepousoService). Valor abaixo e fixo so para dev/teste local;
    # em homolog/prod DEVE vir de variavel de ambiente/secret manager, nunca
    # commitado (mesmo cuidado documentado para a chave RSA do Authorization
    # Server em AuthorizationServerConfig).
    chave-criptografia: ${FISCALADAPTER_CHAVE_CRIPTOGRAFIA:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
