# Enderecos dos webservices do MDF-e (modelo 58, layout 3.00) por UF e ambiente.
# Fonte: ACBrMDFeServicos.ini do projeto ACBr, obtido em 2026-08-31
# (https://github.com/frones/ACBr/blob/master/Fontes/ACBrDFe/ACBrMDFe/ACBrMDFeServicos.ini).
# Diferente do CT-e (FIS-44), o MDF-e e 100% centralizado na SVRS (Sefaz
# Virtual RS) - todas as 27 UFs delegam para o mesmo endereco, nenhuma tem
# infraestrutura propria. So o modo SINCRONO (MDFeRecepcaoSinc) e usado - o
# modo em lote (MDFeRecepcao/MDFeRetRecepcao) foi desativado pela SEFAZ em
# 30/06/2024 (NT 2024.001), mesma migracao do CT-e.
# A SEFAZ ocasionalmente muda esses enderecos - revalidar periodicamente.

