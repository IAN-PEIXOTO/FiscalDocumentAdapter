# Profile de homologacao (FIS-26/32). Ativar com SPRING_PROFILES_ACTIVE=homolog.
# Mesma logica fail-fast do application-prod.yml (ver comentario la) - banco
# e chave de criptografia proprios do ambiente, sem cair no default de dev.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # FIS-82: pool menor que prod - volume de homologacao e bem mais baixo. Mesmo raciocinio do
    # application-prod.yml (ver comentario la) para leak-detection-threshold.
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

fiscaladapter:
  ambiente: homolog
  sefaz:
    tipo-ambiente: homologacao
  seguranca:
    chave-criptografia: ${FISCALADAPTER_CHAVE_CRIPTOGRAFIA}
    # FIS-97: mesma logica fail-fast do application-prod.yml (ver comentario la).
    chave-rsa-jwk: ${FISCALADAPTER_CHAVE_RSA_JWK}
