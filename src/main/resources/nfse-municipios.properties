# Padrao de NFS-e por municipio (codigo IBGE de 7 digitos), FIS-20.
#
# Municipios nao listados aqui usam o padrao default (ABRASF_V2_01) - a
# grande maioria dos municipios brasileiros que emite NFS-e eletronica adota
# alguma variante do ABRASF. Este arquivo existe para o caso (comum na
# pratica) de uma prefeitura especifica ter um webservice com um schema
# proprio (GINFES, DSF, ou uma variacao do ABRASF fora do padrao) que precise
# de um NfseXmlGenerator dedicado - ver documentacao no README ("NFS-e").
#
# Exemplos (documentando o formato - todos usam o default hoje):
# 3550308=ABRASF_V2_01
# 3304557=ABRASF_V2_01
