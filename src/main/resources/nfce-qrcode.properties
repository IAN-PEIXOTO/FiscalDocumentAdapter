# URL de consulta publica do QR Code da NFC-e (modelo 65), por UF e ambiente.
# Fonte: storage/wsnfe_4.00_mod65.xml do projeto nfephp-org/sped-nfe
# (https://github.com/nfephp-org/sped-nfe), obtido em 2026-08-27. Cada UF
# expõe so um endpoint HTTP de consulta (nao SOAP) - o mesmo endereco aceita
# tanto o formato de query da versao 2 quanto da versao 3 do QR Code (so o
# formato da string muda, nao o host), entao guardamos um unico endereco por
# UF/ambiente aqui. Preferido o endereco mais recente (versao 300) quando
# disponivel na fonte, com fallback para o de versao 200 quando so esse
# existia. Revalidar periodicamente, como o nfe-webservices.properties.

