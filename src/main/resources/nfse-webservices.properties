# Enderecos dos webservices municipais de NFS-e (padrao ABRASF), por
# municipio (codigo IBGE de 7 digitos) e ambiente, FIS-21.
#
# Diferente da NFe (uma unica lista nacional por UF, ver
# nfe-webservices.properties / ACBrNFeServicos.ini), NFS-e NAO TEM um
# catalogo publico unico e confiavel de webservices por municipio: cada
# prefeitura contrata sua propria plataforma (algumas usam a mesma
# plataforma terceirizada para varios municipios, outras tem sistema
# proprio), e o endpoint so e conhecido durante o processo de credenciamento
# do contribuinte junto aquela prefeitura especifica.
#
# Por isso este arquivo comeca vazio - cada municipio atendido precisa ter
# seu endpoint adicionado aqui manualmente durante o onboarding do cliente
# (nao existe um endpoint "generico" ou "de exemplo" que funcione de fato,
# entao nao faz sentido inventar um placeholder). Formato esperado quando
# um municipio for adicionado:
#
# {codigoIbge}.{PRODUCAO|HOMOLOGACAO}.{GERAR_NFSE|CONSULTAR_NFSE_RPS|CANCELAR_NFSE}=https://...
#
# Exemplo (ilustrativo - nao e um endpoint real):
# 3550308.HOMOLOGACAO.GERAR_NFSE=https://homologacao.nfse.exemplo.gov.br/ws/nfse.asmx
